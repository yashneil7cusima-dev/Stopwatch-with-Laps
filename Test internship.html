<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch with Laps</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 32px;
        }

        .display {
            font-family: monospace;
            font-size: 58px;
            font-weight: bold;
            margin: 25px 0;
            letter-spacing: 2px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        #startStop {
            background: #222;
            color: white;
        }

        #lap {
            background: #ddd;
            color: #222;
        }

        #reset {
            background: #e5e5e5;
            color: #222;
        }

        .laps-section {
            text-align: left;
        }

        .laps-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .laps-header h2 {
            font-size: 20px;
        }

        .lap-count {
            color: #777;
            font-size: 14px;
        }

        #laps {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            font-family: monospace;
            font-size: 16px;
        }

        .lap-item.fastest {
            color: green;
            font-weight: bold;
        }

        .lap-item.slowest {
            color: red;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .shortcuts {
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

        kbd {
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 2px 6px;
            font-family: monospace;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px 18px;
            }

            .display {
                font-size: 42px;
            }

            .buttons {
                flex-wrap: wrap;
            }

            button {
                padding: 10px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Stopwatch</h1>

        <div class="display" id="display">
            00:00.00
        </div>

        <div class="buttons">
            <button id="startStop">Start</button>
            <button id="lap">Lap</button>
            <button id="reset">Reset</button>
        </div>

        <div class="laps-section">

            <div class="laps-header">
                <h2>Laps</h2>
                <span class="lap-count" id="lapCount">0 laps</span>
            </div>

            <ul id="laps">
                <li class="empty">No laps recorded</li>
            </ul>

        </div>

        <div class="shortcuts">
            <p>
                <kbd>Space</kbd> Start / Stop
                &nbsp;&nbsp;
                <kbd>L</kbd> Lap
            </p>
        </div>

    </div>


    <script>
        // Stopwatch variables
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;

        // Lap variables
        let lastLapTime = 0;
        let laps = [];

        // Elements
        const display = document.getElementById("display");
        const startStopButton = document.getElementById("startStop");
        const lapButton = document.getElementById("lap");
        const resetButton = document.getElementById("reset");
        const lapsList = document.getElementById("laps");
        const lapCount = document.getElementById("lapCount");


        // Format time as MM:SS.HH
        function formatTime(time) {

            const totalHundredths = Math.floor(time / 10);

            const minutes = Math.floor(totalHundredths / 6000);

            const seconds = Math.floor(
                (totalHundredths % 6000) / 100
            );

            const hundredths = totalHundredths % 100;

            return (
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0") +
                "." +
                String(hundredths).padStart(2, "0")
            );
        }


        // Update display
        function updateDisplay() {

            if (isRunning) {
                elapsedTime = Date.now() - startTime;
            }

            display.textContent = formatTime(elapsedTime);
        }


        // Start / Stop
        function startStop() {

            if (!isRunning) {

                startTime = Date.now() - elapsedTime;

                timerInterval = setInterval(updateDisplay, 10);

                isRunning = true;

                startStopButton.textContent = "Stop";

            } else {

                elapsedTime = Date.now() - startTime;

                clearInterval(timerInterval);

                isRunning = false;

                startStopButton.textContent = "Start";

                updateDisplay();
            }
        }


        // Add lap
        function addLap() {

            // Do not allow laps before starting
            if (!isRunning && elapsedTime === 0) {
                return;
            }

            const currentTime = isRunning
                ? Date.now() - startTime
                : elapsedTime;

            const lapTime = currentTime - lastLapTime;

            lastLapTime = currentTime;

            laps.push({
                number: laps.length + 1,
                time: lapTime,
                total: currentTime
            });

            renderLaps();
        }


        // Render laps
        function renderLaps() {

            lapsList.innerHTML = "";

            if (laps.length === 0) {

                lapsList.innerHTML =
                    '<li class="empty">No laps recorded</li>';

                lapCount.textContent = "0 laps";

                return;
            }

            lapCount.textContent =
                `${laps.length} ${laps.length === 1 ? "lap" : "laps"}`;


            // Find fastest and slowest lap
            let fastestIndex = 0;
            let slowestIndex = 0;

            for (let i = 1; i < laps.length; i++) {

                if (laps[i].time < laps[fastestIndex].time) {
                    fastestIndex = i;
                }

                if (laps[i].time > laps[slowestIndex].time) {
                    slowestIndex = i;
                }
            }


            // Display newest lap first
            [...laps].reverse().forEach((lap, reverseIndex) => {

                const originalIndex =
                    laps.length - 1 - reverseIndex;

                const li = document.createElement("li");

                li.className = "lap-item";

                if (
                    laps.length > 1 &&
                    originalIndex === fastestIndex
                ) {
                    li.classList.add("fastest");
                }

                if (
                    laps.length > 1 &&
                    originalIndex === slowestIndex
                ) {
                    li.classList.add("slowest");
                }

                li.innerHTML = `
                    <span>Lap ${lap.number}</span>
                    <span>${formatTime(lap.time)}</span>
                `;

                lapsList.appendChild(li);
            });
        }


        // Reset stopwatch
        function reset() {

            clearInterval(timerInterval);

            isRunning = false;

            startTime = 0;
            elapsedTime = 0;
            lastLapTime = 0;

            laps = [];

            display.textContent = "00:00.00";

            startStopButton.textContent = "Start";

            renderLaps();
        }


        // Button events
        startStopButton.addEventListener("click", startStop);

        lapButton.addEventListener("click", addLap);

        resetButton.addEventListener("click", reset);


        // Keyboard shortcuts
        document.addEventListener("keydown", function(event) {

            // Space = Start / Stop
            if (event.code === "Space") {

                event.preventDefault();

                startStop();
            }

            // L = Lap
            if (
                event.key.toLowerCase() === "l" &&
                !event.ctrlKey &&
                !event.altKey &&
                !event.metaKey
            ) {

                addLap();
            }

        });


        // Initial display
        updateDisplay();
    </script>

</body>
</html>
